name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm plant-lab:build
      - run: pnpm plant-lab:test
      - run: pnpm demo:stale-permit
      - run: pnpm demo:ambiguous-completion
      - run: pnpm case:verify
      - run: pnpm exec tsx apps/cli/src/index.ts compile fixtures/cstr/engineering/R17.json
      - run: pnpm exec tsx apps/cli/src/index.ts diff R17 R18
      - run: pnpm check:refund
      - run: pnpm replay:refund
